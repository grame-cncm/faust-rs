[package]
name = "tree-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints.rust]
unsafe_code = "allow" # Shared opaque tree handles cross the Box/Signal C ABI.
unused_attributes = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = "warn"

[dependencies]
tlib = { path = "../tlib" }
ffi-common = { path = "../ffi-common" }
