[package]
name = "compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["backend-wasm"]
backend-wasm = ["codegen/backend-wasm"]

[dependencies]
clap.workspace = true
errors = { path = "../errors" }
parser = { path = "../parser" }
codegen = { path = "../codegen" }
boxes = { path = "../boxes" }
eval = { path = "../eval" }
propagate = { path = "../propagate" }
signals = { path = "../signals" }
ui = { path = "../ui" }
fir = { path = "../fir" }
serde_json = "1"
tlib = { path = "../tlib" }
transform = { path = "../transform" }
wasmprinter = "0.225"
sigtype = { path = "../sigtype" }
draw = { path = "../draw" }

[dev-dependencies]
[[bin]]
name = "faust-rs"
path = "src/main.rs"

[lints]
workspace = true
