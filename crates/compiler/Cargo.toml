[package]
name = "compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["backend-wasm"]
backend-wasm = ["codegen/backend-wasm"]

[dependencies]
clap.workspace = true
diagnostics = { path = "../diagnostics" }
parser = { path = "../parser" }
codegen = { path = "../codegen" }
boxes = { path = "../boxes" }
eval = { path = "../eval" }
propagate = { path = "../propagate" }
interval = { path = "../interval" }
signals = { path = "../signals" }
ui = { path = "../ui" }
fir = { path = "../fir" }
serde_json = "1"
unicode-width = "0.2"
tlib = { path = "../tlib" }
transform = { path = "../transform" }
wasmprinter = "0.225"
sigtype = { path = "../sigtype" }
draw = { path = "../draw" }

[dev-dependencies]
[[bin]]
name = "faust-rs"
path = "src/main.rs"

[lints]
workspace = true

# The CLI binary only. `mimalloc` is not a library dependency: a library must
# not impose an allocator on its consumers, and nothing in `compiler`'s public
# API depends on it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"
