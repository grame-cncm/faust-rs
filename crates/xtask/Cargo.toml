[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clap.workspace = true
compiler = { path = "../compiler" }
codegen = { path = "../codegen" }
fir = { path = "../fir" }
tlib = { path = "../tlib" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
parser = { path = "../parser" }
wasmparser = "0.240"

[dev-dependencies]
wat = "1"

[lints]
workspace = true

# The profiling harness must measure the shipped configuration: `faust-rs`
# selects `mimalloc`, and without it here `compile-profile` overstates
# allocation-heavy stages (measured 39 % on `fir-prepare-normalize`) and would
# misdirect the next optimisation.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"
