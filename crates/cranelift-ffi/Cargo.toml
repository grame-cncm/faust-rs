[package]
name = "cranelift-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "cranelift_ffi"
crate-type = ["rlib"]

[features]
default = []
standalone-capi-globals = []

[dependencies]
box_ffi = { package = "box-ffi", path = "../box-ffi", default-features = false }
clap.workspace = true
codegen = { path = "../codegen" }
compiler = { path = "../compiler" }
fir = { path = "../fir" }
ffi-common = { path = "../ffi-common" }
serde_json = "1"

[dev-dependencies]
interp_ffi = { package = "interp-ffi", path = "../interp-ffi" }

# FFI crate will require raw pointers/unsafe in later phases; allow is local to
# this crate so the workspace default can remain strict.
[lints.rust]
unsafe_code = "allow" # Cranelift C/C++ API owns raw factories, instances, and callback tables.
unused_attributes = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = "warn"

# Both binaries are declared explicitly. Without an entry, Cargo auto-discovers
# `src/bin/*.rs` and takes the file stem as the binary name — which is how
# `impulse_cranelift` ended up underscored while every other tool, and its own
# clap `name`, used a hyphen. Rust files stay snake_case; the shipped commands
# are hyphenated.
[[bin]]
name = "impulse-cranelift"
path = "src/bin/impulse_cranelift.rs"

[[bin]]
name = "mem0-json-check"
path = "src/bin/mem0_json_check.rs"

[[bin]]
name = "faustprobe"
path = "src/bin/faustprobe.rs"
