name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets

  lint_and_test:
    name: Lint and test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    env:
      # The vector-mode regression corpus imports `stdfaust.lib`; the compiler
      # resolves it from FAUST_LIB_PATH first. Point it at the pinned Faust
      # standard-library checkout added below. Unlike `apt-get install faust`,
      # a git checkout works on all three runner OSes.
      #
      # `faustlibraries/old` carries deprecated pre-reorganization names
      # (`oscillator.lib`, `filter.lib`, `effect.lib`, ...) that some impulse-tests
      # corpus DSPs (e.g. `spectral_tilt.dsp`) still import directly — the same
      # reason `vector_retention` below includes it. A real Faust install's
      # `/usr/local/share/faust` bundles these as compatibility shims, masking
      # the gap on a dev machine; a plain `faustlibraries` checkout does not.
      # `std::env::split_paths` wants the platform separator, hence the
      # per-OS `;`/`:` here rather than a literal one like `vector_retention`
      # (Ubuntu-only) uses.
      FAUST_LIB_PATH: ${{ github.workspace }}/faustlibraries${{ matrix.os == 'windows-latest' && ';' || ':' }}${{ github.workspace }}/faustlibraries/old
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check out the Faust standard libraries
        uses: actions/checkout@v4
        with:
          repository: grame-cncm/faustlibraries
          ref: ecf2fdc238148c44c18352102333a1229ca7a8d3
          path: faustlibraries

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Backend C++ module-first checks
        run: |
          cargo test -p codegen --all-targets
          cargo run -p compiler -- --dump-cpp tests/corpus/rep_01_passthrough.dsp
          cargo run -p xtask -- cpp-backend-diff-report

      - name: Golden output check
        run: cargo run -p xtask -- golden-check

      # Static source analysis: the production-line threshold, the retired
      # vector alias paths, and the producer/checker separation. Pure text
      # analysis, so one runner settles it for all three.
      #
      # Its sibling `cli-transcript-check` is deliberately *not* here: 35 of
      # its 148 snapshots embed machine-specific absolute paths, so it only
      # reproduces on the machine that recorded it. See the module header of
      # `crates/xtask/src/cli_transcript.rs` for the three sources and why
      # post-hoc text normalization cannot reconcile them.
      - name: Structure check (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p xtask -- cli-parser-check
          cargo run -p xtask -- error-model-check
          cargo run -p xtask -- ffi-boundary-check
          cargo run -p xtask -- structure-check

      - name: Backend alignment smoke (PR only)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: cargo run -p xtask -- backend-align-smoke --skip-golden

  vector_retention:
    name: Checked vector retention (Ubuntu)
    needs: check
    runs-on: ubuntu-latest
    env:
      # Keep the performance corpus on the same pinned standard-library
      # revision as the cross-platform lint-and-test job. The Ubuntu package
      # can lag that revision and does not provide dx.algorithm used by the
      # dx7_alg5 front-end budget case.
      # `stdfaust.lib` itself imports dx7.lib from the checkout's dx7/
      # directory.
      # The vector corpus also contains historical DSPs that import legacy
      # names such as math.lib from the checkout's old/ directory.
      FAUST_LIB_PATH: ${{ github.workspace }}/faustlibraries:${{ github.workspace }}/faustlibraries/dx7:${{ github.workspace }}/faustlibraries/old
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check out the Faust standard libraries
        uses: actions/checkout@v4
        with:
          repository: grame-cncm/faustlibraries
          ref: ecf2fdc238148c44c18352102333a1229ca7a8d3
          path: faustlibraries

      - name: Checked vector coverage retention
        run: cargo run -p xtask -- vector-coverage-check

      - name: Checked vector interpreter optimization parity
        run: cargo run -p xtask -- vector-interp-opt-check

      - name: Release compilation cost budget (codegen + normalized front end)
        run: cargo run --release -p xtask -- compile-budget-check
